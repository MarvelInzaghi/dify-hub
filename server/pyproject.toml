[project]
name = "dify-hub-server"
version = "0.1.0"
description = "Unified prompt + skill management platform bolted onto Dify (no source changes)."
requires-python = ">=3.11"
# Phase 0 needs only httpx + pydantic-settings. FastAPI / SQLAlchemy land in Phase 1+
# (web API + own DB). Alembic is deferred until the schema stabilizes (prod hardening).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "cryptography>=42",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "fastmcp>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
